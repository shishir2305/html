<!DOCTYPE html>
<!-- Declares that this document uses modern HTML standards (HTML5) -->

<html lang="en">
<!-- Root element of the page; lang="en" tells browsers and screen readers that the content is English -->

<head>
    <!-- Contains page metadata and resources; its contents are generally not displayed on the page -->

    <meta charset="UTF-8">
    <!-- Sets UTF-8 character encoding so the page correctly supports text, symbols, and emojis -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Makes the page responsive by matching the viewport width to the device width and setting the initial zoom to 100% -->

    <title>My Website</title>
    <!-- Sets the title displayed in the browser tab, bookmarks, and browser history -->

</head>
<!-- End of the document's metadata section -->

<body>
    <!-- Contains all the content that is rendered and visible on the webpage -->


    <script src="app.js" defer></script>
    <!-- Loads the JavaScript file; defer downloads it without blocking HTML parsing and executes it after HTML parsing is complete -->

</body>
<!-- End of the visible webpage content -->

</html>
<!-- End of the HTML document -->
