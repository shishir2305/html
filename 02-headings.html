<h1>Main Page Heading</h1>
<!-- Main topic of the page -->

<h2>Major Section</h2>
<!-- Major section under h1 -->

<h3>Subsection</h3>
<!-- Subsection under h2 -->

<h4>Nested Subsection</h4>
<!-- Deeper subsection; use only when required -->

<h5>...</h5>
<!-- Rarely used -->

<h6>...</h6>
<!-- Lowest heading level; rarely used -->


<!--
IMPORTANT CONVENTIONS:
• Headings define content hierarchy, not font size.
• Usually use one clear <h1> for the page's primary topic.
• Use <h2> → <h3> → <h4> for logical nesting.
• Don't use headings just to make text large/bold; use CSS.
• Keep headings descriptive and concise.
• Don't use <div>/<p> as a replacement for semantic headings.
• Good heading structure improves accessibility and helps search
  engines understand the page structure.
• Heading level should be based on semantic hierarchy, not styling.
-->
