<p>This is a paragraph.</p>
<!-- <p> represents a paragraph of text -->

<p>
    This is another paragraph containing more text.
</p>
<!-- Paragraphs are block-level elements and normally start on a new line -->


<!--
IMPORTANT CONVENTIONS:
• Use <p> for paragraphs of text.
• Browsers automatically add default spacing around paragraphs.
• Don't use <p> just to create spacing; use CSS for layout/spacing.
• Don't use <p> for headings; use <h1>–<h6>.
• Don't put block-level elements such as <div>, <h1>, or <p>
  inside a <p>.
• <p> is intended for a distinct block of text/content.
-->
