<span>Inline text</span>
<!-- Generic inline container; use when you need to style/group text with CSS/JS -->

<strong>Important text</strong>
<!-- Strong importance; usually rendered bold -->

<em>Emphasized text</em>
<!-- Semantic emphasis; usually rendered italic -->

<b>Bold text</b>
<!-- Stylistic attention without implying importance -->

<i>Italic text</i>
<!-- Alternate voice/mood/term; not simply "make text italic" -->

<u>Underlined text</u>
<!-- Non-textual annotation; avoid using it just for styling -->

<small>Small text</small>
<!-- Side comments, fine print, legal/disclaimer text -->

<mark>Highlighted text</mark>
<!-- Marks/relevant text, usually displayed with a highlight -->

<del>Old price: ₹999</del>
<!-- Text that has been deleted/removed -->

<ins>New price: ₹799</ins>
<!-- Text that has been inserted/added -->

H<sub>2</sub>O
<!-- Subscript text; appears below the normal baseline -->

x<sup>2</sup>
<!-- Superscript text; appears above the normal baseline -->

<br>
<!-- Forces a line break; use sparingly, not for layout -->

<hr>
<!-- Represents a thematic break/change of topic -->

<!--
IMPORTANT DISTINCTIONS:

• <span>  → Generic inline container; no semantic meaning by itself.
• <strong> → Importance      | <b> → Visual attention only.
• <em>     → Emphasis         | <i> → Alternate voice/term/style.
• <u>      → Annotation, NOT general-purpose styling.
• <small>  → Fine print/side comments.
• <mark>   → Relevant/highlighted text.
• <del>    → Deleted content   | <ins> → Added content.
• <sub>    → Below baseline   | <sup> → Above baseline.
• <br>     → Line break        | <hr> → Thematic separation.

• Use CSS for visual styling; use semantic HTML when the meaning matters.
• <br> and <hr> are void elements — they don't have closing tags.
-->
