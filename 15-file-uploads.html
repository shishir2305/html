<form action="/upload" method="POST" enctype="multipart/form-data">

    <label for="file">Choose a file:</label>

    <input
        type="file"
        id="file"
        name="file"
    >
    <!--
        type="file" → Allows the user to select a file.

        name        → Field name sent to the server.

        enctype     → multipart/form-data is required when
                      submitting files through a form.
    -->


    <button type="submit">Upload</button>

</form>


<!-- Multiple files -->
<input
    type="file"
    name="files"
    multiple
>
<!-- multiple → Allows selecting multiple files -->


<!-- Restrict file types -->
<input
    type="file"
    name="image"
    accept="image/*"
>
<!-- accept → Suggests which file types the user can select -->


<!-- Specific file types -->
<input
    type="file"
    name="document"
    accept=".pdf,.doc,.docx"
>
<!-- accept → Restricts the file picker to the specified types -->


<!--
IMPORTANT:

• <input type="file"> → File selection.
• enctype="multipart/form-data" → Required for traditional
  form-based file uploads.
• multiple → Allows multiple file selection.
• accept → Specifies allowed/suggested file types.
• The browser sends the selected file as multipart form data.
• ALWAYS validate file type, size, and content on the server.
• Never rely only on accept for security; it can be bypassed.
-->
